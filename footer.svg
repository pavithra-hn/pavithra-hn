  <rect x="60" y="36" width="12" height="6" fill="#FF7EB6"/>
  <rect x="6" y="42" width="60" height="6" fill="#FF7EB6"/>
  <rect x="6" y="48" width="60" height="6" fill="#E05A97"/>
  <rect x="12" y="54" width="12" height="6" fill="#E05A97"/>
  <rect x="48" y="54" width="12" height="6" fill="#E05A97"/>
  <g class="blink"><rect x="24" y="24" width="6" height="6" fill="#4A2C5A"/><rect x="48" y="24" width="6" height="6" fill="#4A2C5A"/></g>
</g></g>
<text x="196" y="80" class="sans" font-size="31" font-weight="800" fill="#4A2C5A">thanks for stopping by</text>
<text x="198" y="114" class="sans" font-size="17" font-weight="600" fill="#9A7FAE">always happy to talk about LLMs, RAG and shipping AI</text>
<g transform="translate(1010,44)">
