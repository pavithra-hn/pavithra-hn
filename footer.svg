<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="A little pink robot waving goodbye beside the words thanks for stopping by.">
<defs>
  <linearGradient id="fcard" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFF4FB"/>
  </linearGradient>
</defs>
<style>
  .sans { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', Verdana, sans-serif; }
  .hop { animation: hop .8s steps(2) infinite; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.4s steps(1) infinite; }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
  .heart { transform-box: fill-box; transform-origin: center; animation: floatUp 6.2s linear infinite; }
  .glow { transform-box: fill-box; transform-origin: center; animation: glow 3.6s ease-in-out infinite alternate; }
  .d1 { animation-delay: -.5s; } .d2 { animation-delay: -1.1s; } .d3 { animation-delay: -1.7s; }
  .h1 { animation-delay: 0s; } .h2 { animation-delay: -3.1s; }
  @keyframes hop { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
  @keyframes blink { 0%, 88% { transform: scaleY(1); } 92%, 96% { transform: scaleY(.12); } 100% { transform: scaleY(1); } }
  @keyframes twinkle { 0%, 100% { transform: scale(.35); opacity: .35; } 50% { transform: scale(1); opacity: 1; } }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(12px) scale(.7); } 18% { opacity: .9; } 70% { opacity: .9; } 100% { opacity: 0; transform: translateY(-40px) scale(1.05); } }
  @keyframes glow { from { opacity: .45; transform: scale(1); } to { opacity: .8; transform: scale(1.07); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .heart { opacity: .9; } }
</style>
<rect x="1.5" y="1.5" width="1197" height="157" rx="26" fill="url(#fcard)" stroke="#F6E2EF" stroke-width="3"/>
<g class="glow"><circle cx="108" cy="84" r="66" fill="#FFE7F4"/></g>
<g transform="translate(72,54)"><g class="hop">
